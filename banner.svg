<svg
  width="100%"
  height="220"
  viewBox="0 0 1000 220"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2128" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2d333b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background base -->
  <path d="M 0 0 L 1000 0 L 1000 155 Q 750 190 500 160 T 0 175 Z" fill="url(#gradient1)"/>

  <!-- Layered wave curves -->
  <path d="M 0 0 L 1000 0 L 1000 145 Q 750 170 500 150 T 0 165 Z" fill="url(#wave1)"/>
  <path d="M 0 0 L 1000 0 L 1000 130 Q 750 150 500 135 T 0 145 Z" fill="url(#wave2)"/>

  <!-- Centered Title Typography -->
  <text
    x="500"
    y="78"
    text-anchor="middle"
    fill="#ffffff"
    font-size="34"
    font-weight="700"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    letter-spacing="0.5"
  >Welcome to Yeswanth's Github</text>

  <!-- Subtitle -->
  <text
    x="500"
    y="112"
    text-anchor="middle"
    fill="#8b949e"
    font-size="20"
    font-weight="600"
    font-family="Consolas, 'Courier New', monospace"
    letter-spacing="2"
  >&lt;/&gt;</text>
</svg>
